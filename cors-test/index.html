<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba CORS FastAPI</title>
</head>
<body>
  <h1>Prueba CORS con FastAPI</h1>

  <div>
    <label>Email:</label>
    <input id="email" value="user01@example.com" />
  </div>

  <div>
    <label>Password:</label>
    <input id="password" type="password" value="Password123!" />
  </div>

  <br />

  <button onclick="testHealth()">Probar /health</button>
  <button onclick="login()">Login</button>
  <button onclick="getMe()">Probar /users/me</button>

  <pre id="output"></pre>

  <script>
  function print(data) {
    document.getElementById("output").textContent =
      typeof data === "string" ? data : JSON.stringify(data, null, 2);
  }

  function saveTokens(data) {
    localStorage.setItem("access_token", data.access_token);

    if (data.refresh_token) {
      localStorage.setItem("refresh_token", data.refresh_token);
    }
  }

  function getAccessToken() {
    return localStorage.getItem("access_token");
  }

  function getRefreshToken() {
    return localStorage.getItem("refresh_token");
  }

  function clearTokens() {
    localStorage.removeItem("access_token");
    localStorage.removeItem("refresh_token");
    print("Tokens eliminados");
  }

  async function login() {
    try {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const formData = new URLSearchParams();
      formData.append("username", email);
      formData.append("password", password);

      const response = await fetch("http://localhost:8000/api/v1/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData
      });

      const data = await response.json();

      console.log("Login response:", data);

      if (!response.ok) {
        print({
          status: response.status,
          message: "Login fallido",
          error: data
        });
        return;
      }

      saveTokens(data);

      print({
        status: response.status,
        message: "Login correcto",
        access_token_saved: Boolean(localStorage.getItem("access_token")),
        refresh_token_saved: Boolean(localStorage.getItem("refresh_token")),
        access_token_preview: data.access_token.substring(0, 30) + "...",
        refresh_token_preview: data.refresh_token
          ? data.refresh_token.substring(0, 30) + "..."
          : null
      });

    } catch (error) {
      console.error(error);
      print("Error en login: " + error.message);
    }
  }

  async function getMe() {
    try {
      const accessToken = getAccessToken();

      if (!accessToken) {
        print("Primero debes hacer login. No hay access_token guardado.");
        return;
      }

      const response = await fetch("http://localhost:8000/api/v1/users/me", {
        method: "GET",
        headers: {
          "Authorization": `Bearer ${accessToken}`
        }
      });

      const data = await response.json();

      print({
        status: response.status,
        ok: response.ok,
        data
      });

    } catch (error) {
      console.error(error);
      print("Error llamando /users/me: " + error.message);
    }
  }
</script>
</body>
</html>
